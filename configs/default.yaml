seed_list: [0, 1, 2, 3, 4]

data:
  page_size: 100          # per_page=200 is deprecated by OpenAlex (2026-10 refresh); keep 100
  mailto: null            # OpenAlex now ignores mailto (2026-10 refresh); kept for the polite-pool header only
  max_retries: 5
  backoff_base_s: 2.0
  api_key_mode: bearer      # bearer (Authorization header) | param (api_key query param); env OPENALEX_KEY_MODE overrides — verify with check_key() at S0.4
  max_requests_per_s: 10    # client throttle; a free key allows 30/s; null = off
  timeout_s: 60             # per-request HTTP timeout, seconds
  pages_per_part: 1         # resumable pulls: pages per committed part (state written after each)

labels:
  natures: [Retraction]   # which RWDB notice types count as positives — PROVISIONAL(G3), Maor decides (slice_shortlist.md)

slice: {}                 # filled by S1.3 -> configs/slice.yaml

slice_selection:          # S1.3, citecurv.data.slice_query
  works_target: 300000    # L11 size target
  works_tol: 0.5          # accept 150K-450K works
  min_edges: 2000000      # S1.3 edge floor
  min_labeled: 300        # labeled papers in slice
  min_labeled_test: 100   # labeled papers in the test window
  max_cost_usd: 0.5       # pull budget
  daily_cap: 1000000      # results per day
  doi_batch_size: 50      # DOIs per OR call (documented max 100)
  sample_n: 100           # refs-per-work sample, one page

embed:                    # S1.6, citecurv.embed.specter2
  model: allenai/specter2_base
  adapter: allenai/specter2       # proximity adapter (naming trap: this is the adapter, not the base)
  batch_size: 32
  max_length: 512
  chunk_size: 20000               # resumable chunks on Drive

curvature:
  screen_percentile_low: null      # S2.3: lower quantile level of training-row Forman, e.g. 0.01
  screen_percentile_high: null     # S2.3: upper quantile level, e.g. 0.99
  screen_inclusive_ties: false     # false: flag F < lo or F > hi; true: <= / >=
  screen_count_duplicates: false   # false: duplicate (src,dst) rows count once in degrees
  orc_radius: null                 # S2.3; 2 = exact time-t ORC, 1 = exact when src is uncited at t
  orc_subgraph_edge_cap: 5000      # tiered truncation, lossless unless relevant edges exceed it
  orc_prune: true                  # drop edges that cannot change unweighted ORC(u,v)
  orc_escalate_chunk: 5000         # rows per checkpoint in notebooks/30
  orc:
    alpha: 0.5
    method: OTDSinkhornMix         # never ATD (ZeroDivisionError on uncited sources, both versions)
    nbr_topk: 3000
    proc: 1
    shortest_path: pairwise

tgn:
  node_feat_dim: 768
  memory_projection_dim: null    # fallback knob if 768-dim memory is too heavy
  epochs: 50                     # DyGLib --num_epochs; early stopping on validation
  patience: 20                   # early-stopping patience
  batch_size: 200                # DyGLib default
  num_neighbors: 10              # DyGLib best TGN config
  num_layers: 1                  # DyGLib best TGN config
  num_heads: 2
  dropout: 0.1
  time_feat_dim: 100
  sample_neighbor_strategy: recent
  learning_rate: 1.0e-4          # DyGLib default
  direction_aware: true          # vendored patch P5 (keeps citation direction) — Maor reviews
  leak_check: false              # memory leak hook; turn on for the S1.7 pilot
  infer:
    batch_size: 200
    align_to_timestamps: true    # batches cut between days -> memory holds only ts < t
    max_batch_size: 2000
    embeddings_dtype: float32    # float16 halves the 2*M*d endpoint-embedding file

scoring:
  cold_start_k: 3                # provisional (L19), finalized in S2.4; D8 off-by-one in score_components.md
  weights:                       # on the simplex (sum 1); calibrated per run in S3.2 — these are inert defaults
    s_embed: 0.25
    s_geom: 0.25
    s_temp: 0.25
    s_curvdyn: 0.25
  zstats: {robust: false, std_floor: 1.0e-6, exclude_cold_start: true}   # train-only normalisation
  calibration: {step: 0.1, metric: ap}       # simplex lattice step (286 points); objective on val rows
  learned_combiner: {C: 1.0, class_weight: balanced, random_state: 0, max_iter: 1000}  # L13 extra cell only
  rollup: {role: cited, top_n: 5, threshold: null, author_top_n: 5}      # FR8 paper/author aggregates
  components:                    # docs/score_components.md — PROVISIONAL (S3.1 gate)
    embed_mode: auto             # auto | tgn | static_cosine (rehearsal before the TGN is wired)
    window_days: 90              # s_temp trailing window W (days); provisional
    min_cell: 30                 # earlier values a reference cell needs before use
    curvdyn_pca_dim: 32          # PCA dims per endpoint vector for s_curvdyn
    curvdyn_ridge_alpha: 1.0     # ridge penalty on standardised features
    curvdyn_max_fit_rows: 500000 # seeded cap on train rows for the s_curvdyn fit
    p_link_eps: 1.0e-7           # clip p_link before -ln

eval:
  cutoff_date: null              # set in S4.1
  top_k: [100, 1000]
  split: {min_test_pos: 100, min_test_share: 0.15, positive_unit: paper, val_frac: 0.10}  # S4.1

synthetic:                       # stand-in stream before S4.0 (citecurv.data.synthetic)
  n_works: 20000
  n_fields: 8
  years: [2005, 2025]
  refs_mean: 25
  emb_dim: 64
  knobs: {}                      # overrides of DEFAULT_KNOBS (growth_rate, cross_field_rate, ...)

inject:                          # S4.5 (citecurv.eval.inject)
  n_cartels: 10
  recipient_share: 0.4
  t_min: null                    # cutoff in days; every injected event has t >= t_min
  levels: [blatant, moderate, subtle]
  clique: {n_cliques: 10, clique_size: 15, drop_prob: 0.0}

baselines:                       # S4.4 (citecurv.eval.baselines)
  tier1:
    window_days: 365             # burst_z trailing window W, days
    min_venue_citers: 3          # venue_gini NaN below this many known-venue prior citers
    max_ref_candidates: 20       # ref_overlap: most recent earlier citers of dst compared per event
  tier2_xgb:
    num_boost_round: 300
    max_depth: 4
    eta: 0.1
    nthread: 1                   # 1 = reproducible; raise on Colab if speed matters
  pygod:
    undirected: true             # symmetrise snapshot (PROVISIONAL)
    epoch: 100
    hid_dim: 64
    batch_size: 0                # 0 = full batch; >0 with num_neigh for large snapshots
    num_neigh: -1
  curvgad:
    max_nodes: 10000             # PROVISIONAL node cap (dense N x N); not yet read by code
    epochs: 200
    patience: 100
    lr: 0.01
    K: 7
    manifold_config: H32S32E32

viz:                             # interactive results explorer (citecurv.viz.build_explorer)
  top_n: 500                     # events with a precomputed detail view
  radius: 1                      # graph context hops (1 or 2)
  max_nodes: 40                  # node cap for the drawn subgraph
  flag_share: 0.01               # share of ranked events counted as flags (D4, rollup threshold)
  n_rollup: 200                  # papers/authors kept in the rollup view

curvature_study:                 # scripts/curvature_study.py (synthetic formulation study, docs/curvature_formulation_study.md)
  n_works: 12000
  seeds: [0, 1, 2]
  settings: [blatant, moderate, subtle, clique]
  n_cartels: {blatant: 10, moderate: 10, subtle: 20}
  clique: {n_cliques: 10, clique_size: 10, drop_prob: 0.0}
  test_share: 0.20
  fit_years: 5
  fit_seed_offset: 1000
  n_neg_test: 10000
  n_neg_fit: 3000
  window_days: 365
  audit_deltas: [365, 730]
  alpha: 0.5
  n_xcheck: 10
  n_xcheck_inedges_max: 40
  n_lib: 12
  lr_C: 1.0
  hgb: {max_iter: 150, learning_rate: 0.1, max_leaf_nodes: 15, l2_regularization: 1.0}
